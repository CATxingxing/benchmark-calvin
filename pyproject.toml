[project]
name = "forge-benchmark-calvin"
version = "0.1.0"
description = "Self-contained CALVIN MTLC/LH-MTLC benchmark node for Forge"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dora-rs==0.4.1",
    "dora-rs-cli==0.4.1",
    "forge-msgs==1.2.0",
    "forge-tool[dora]==1.0.0",
    "numpy==1.26.4",
    "pyarrow",
    "pyyaml>=6.0",

    # Runtime dependencies of the unmodified CALVIN sources. CALVIN itself is
    # deliberately not vendored: dataflow/preflight load the checked-out
    # calvin_env and calvin_models trees selected for an evaluation.
    "cloudpickle",
    "gitpython",
    "gym==0.26.2",
    "hydra-core==1.3.2",
    "hydra-colorlog",
    "matplotlib",
    "numba",
    "numpy-quaternion",
    "omegaconf",
    "opencv-python-headless",
    "pandas",
    "pybullet",
    "pyrender",
    "pyglet<2",
    "PyOpenGL",
    "trimesh",
    "urdfpy",
    "pyhash2==0.9.4",
    "pytorch-lightning==1.8.6",
    "rich",
    "scipy",
    "setuptools<81",
    "termcolor",
    "torch==2.5.1",
    "torchmetrics==1.5.2",
    "torchvision==0.20.1",
    "tqdm",
    "wandb",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests", "_core/tests", "bench_tool/tests"]
pythonpath = ["."]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
